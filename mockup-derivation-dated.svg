<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="Georgia,'Times New Roman',serif">
  <rect width="360" height="320" fill="#1b1712"/>
  <text x="20" y="26" font-size="11" letter-spacing="1.4" fill="#a99a83">DERIVATION · when it came together</text>

  <!-- faint time axis on the left: newest at top, oldest at bottom -->
  <line x1="30" y1="50" x2="30" y2="285" stroke="#3a342a" stroke-width="1.5"/>
  <g font-size="9" fill="#8a7f6a" text-anchor="start">
    <circle cx="30" cy="64" r="2.5" fill="#d2685f"/><text x="38" y="67">c. 1400</text>
    <circle cx="30" cy="150" r="2.5" fill="#d2b15c"/><text x="38" y="153">c. 1325</text>
    <circle cx="30" cy="250" r="2.5" fill="#7fae7a"/><text x="38" y="253">Latin antiquity</text>
  </g>

  <!-- connectors -->
  <g fill="none" stroke="#6f6452" stroke-width="1.5">
    <path d="M205 76 L150 116"/>
    <path d="M205 76 L270 116"/>
    <path d="M270 140 L225 212"/>
    <path d="M270 140 L320 212"/>
  </g>
  <!-- combination annotations on the merges -->
  <text x="150" y="100" font-size="9" font-style="italic" fill="#cdbfa6">in- added → c. 1400</text>
  <text x="318" y="180" text-anchor="end" font-size="9" font-style="italic" fill="#cdbfa6">borrowed from Latin</text>
  <text x="318" y="191" text-anchor="end" font-size="9" font-style="italic" fill="#cdbfa6">crēdibilis · c. 1325</text>

  <!-- incredible (top, newest) -->
  <rect x="150" y="50" width="110" height="28" rx="10" fill="#3a201d" stroke="#d2685f"/>
  <text x="205" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#f0c9c4">incredible</text>

  <!-- in- -->
  <g><rect x="104" y="118" width="92" height="34" rx="9" fill="#3a201d" stroke="#d2685f" stroke-opacity="0.7"/>
     <text x="150" y="134" text-anchor="middle" font-size="13" fill="#f0c9c4">in-</text>
     <text x="150" y="146" text-anchor="middle" font-size="8.5" fill="#a99a83">Latin · not</text></g>
  <!-- credible -->
  <g><rect x="224" y="118" width="96" height="34" rx="9" fill="#312b1c" stroke="#d2b15c"/>
     <text x="272" y="134" text-anchor="middle" font-size="13" fill="#e3c46e">credible</text>
     <text x="272" y="146" text-anchor="middle" font-size="8.5" fill="#a99a83">English · c. 1325</text></g>
  <!-- cred- -->
  <g><rect x="180" y="214" width="90" height="34" rx="9" fill="#23311f" stroke="#7fae7a"/>
     <text x="225" y="230" text-anchor="middle" font-size="13" fill="#9ed19a">crēd-</text>
     <text x="225" y="242" text-anchor="middle" font-size="8.5" fill="#a99a83">Latin · believe</text></g>
  <!-- -ible -->
  <g><rect x="282" y="214" width="74" height="34" rx="9" fill="#312b1c" stroke="#d2b15c" stroke-opacity="0.7"/>
     <text x="319" y="230" text-anchor="middle" font-size="13" fill="#e3c46e">-ible</text>
     <text x="319" y="242" text-anchor="middle" font-size="8.5" fill="#a99a83">able to be</text></g>

  <text x="20" y="306" font-size="10.5" font-style="italic" fill="#6f6452">Roots are ancient; each combination is dated to when it first appears.</text>
</svg>
