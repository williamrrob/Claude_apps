<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Georgia,'Times New Roman',serif">
<rect width="360" height="340" fill="#1b1712"/>
<text x="20" y="26" font-size="11" letter-spacing="1.4" fill="#a99a83">DERIVATION · how &amp; when it was built</text>
<!-- legend: colour = morpheme role -->
<g font-size="9.5" fill="#a99a83">
  <circle cx="206" cy="22" r="4" fill="#d2685f"/><text x="213" y="25">prefix</text>
  <circle cx="252" cy="22" r="4" fill="#7fae7a"/><text x="259" y="25">root</text>
  <circle cx="292" cy="22" r="4" fill="#d2b15c"/><text x="299" y="25">suffix</text>
</g>
<!-- era axis (neutral) -->
<line x1="60" y1="58" x2="60" y2="250" stroke="#3a342a" stroke-width="1.4"/>
<g font-size="9.5" fill="#8a7f6a" text-anchor="end">
  <text x="52" y="74">c. 1400</text><text x="52" y="154">c. 1325</text><text x="52" y="239">antiquity</text>
</g>
<!-- edges -->
<path d="M208 87 C208 110.5 138 110.5 138 134" fill="none" stroke="#6f6452" stroke-width="1.5"/><path d="M208 87 C208 110.5 272 110.5 272 134" fill="none" stroke="#6f6452" stroke-width="1.5"/>
<path d="M272 168 C272 193.5 184 193.5 184 219" fill="none" stroke="#6f6452" stroke-width="1.5"/><path d="M272 168 C272 193.5 302 193.5 302 219" fill="none" stroke="#6f6452" stroke-width="1.5"/>
<!-- merge annotations: process + date -->
<text x="150" y="116" text-anchor="middle" font-size="9.5" font-style="italic" fill="#cdbfa6">prefix added</text>
<text x="330" y="196" text-anchor="end" font-size="9.5" font-style="italic" fill="#cdbfa6">borrowed · Lat. crēdibilis</text>
<!-- nodes (two text sizes only) -->
<g><rect x="149" y="53" width="118" height="34" rx="9" fill="#262017" stroke="#a99a83" stroke-opacity="0.7"/><text x="208" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#ece0cc">incredible</text><text x="208" y="82" text-anchor="middle" font-size="9.5" fill="#a99a83">English · c. 1400</text></g>
<g><rect x="97" y="134" width="82" height="34" rx="9" fill="#3a201d" stroke="#d2685f" stroke-opacity="1"/><text x="138" y="150" text-anchor="middle" font-size="14"  fill="#f0c9c4">in-</text><text x="138" y="163" text-anchor="middle" font-size="9.5" fill="#a99a83">not</text></g>
<g><rect x="220" y="134" width="104" height="34" rx="9" fill="#262017" stroke="#a99a83" stroke-opacity="0.7"/><text x="272" y="150" text-anchor="middle" font-size="14"  fill="#ece0cc">credible</text><text x="272" y="163" text-anchor="middle" font-size="9.5" fill="#a99a83">English · c. 1325</text></g>
<g><rect x="141" y="219" width="86" height="34" rx="9" fill="#23311f" stroke="#7fae7a" stroke-opacity="1"/><text x="184" y="235" text-anchor="middle" font-size="14"  fill="#9ed19a">crēd-</text><text x="184" y="248" text-anchor="middle" font-size="9.5" fill="#a99a83">Latin · believe</text></g>
<g><rect x="264" y="219" width="76" height="34" rx="9" fill="#312b1c" stroke="#d2b15c" stroke-opacity="1"/><text x="302" y="235" text-anchor="middle" font-size="14"  fill="#e3c46e">-ible</text><text x="302" y="248" text-anchor="middle" font-size="9.5" fill="#a99a83">able to be</text></g>
<!-- deep ancestor + literal meaning -->
<text x="184" y="262" text-anchor="middle" font-size="9" fill="#6f6452">‹ PIE *ḱred-dʰeh₁- “place trust”</text>
<line x1="20" y1="288" x2="340" y2="288" stroke="#2c2820" stroke-width="1"/>
<text x="20" y="308" font-size="11" fill="#cdbfa6">Literally: <tspan fill="#f0c9c4">“not”</tspan> + <tspan fill="#ece0cc">“believable”</tspan> → “not believable”</text>
<text x="20" y="326" font-size="10.5" font-style="italic" fill="#6f6452">Colour = role · left axis = when each form appears</text>
</svg>