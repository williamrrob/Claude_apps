<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" font-family="Georgia, 'Times New Roman', serif">
  <rect width="380" height="280" fill="#1b1712"/>

  <!-- headword for context -->
  <text x="22" y="34" font-size="22" font-weight="700" fill="#ece0cc">scriptural <tspan font-size="13" font-style="italic" fill="#a99a83">adj.</tspan></text>

  <!-- breakdown card -->
  <rect x="16" y="50" width="348" height="212" rx="16" fill="#262017" stroke="rgba(245,235,215,0.14)"/>
  <text x="34" y="76" font-size="11" letter-spacing="1.4" fill="#a99a83">BREAKDOWN</text>

  <!-- morpheme 1: scribere (root / green) -->
  <rect x="30" y="92" width="3" height="46" rx="1.5" fill="#7fae7a"/>
  <!-- row 1: source word (left)  ...  meaning (right-justified) -->
  <text x="46" y="112" font-size="22" font-weight="700" fill="#7fae7a">scribere</text>
  <text x="346" y="112" text-anchor="end" font-size="15" fill="#ece0cc">to write</text>
  <!-- row 2: origin·kind (left)  ...  shows up as (right-justified) -->
  <text x="46" y="132" font-size="10.5" letter-spacing="0.8" fill="#a99a83">LATIN · ROOT</text>
  <text x="346" y="132" text-anchor="end" font-size="12.5" font-style="italic" fill="#a99a83">shows up as: script, scrib</text>

  <!-- morpheme 2: -alis (suffix / gold) -->
  <rect x="30" y="160" width="3" height="46" rx="1.5" fill="#d2b15c"/>
  <text x="46" y="180" font-size="22" font-weight="700" fill="#d2b15c">-alis</text>
  <text x="346" y="180" text-anchor="end" font-size="15" fill="#ece0cc">relating to</text>
  <text x="46" y="200" font-size="10.5" letter-spacing="0.8" fill="#a99a83">LATIN · SUFFIX</text>
  <text x="346" y="200" text-anchor="end" font-size="12.5" font-style="italic" fill="#a99a83">shows up as: al</text>

  <!-- note -->
  <text x="46" y="240" font-size="11.5" font-style="italic" fill="#6f6452">Second column (meaning + “shows up as”) right-justified to the card edge.</text>
</svg>
