<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- iOS dark-mode app-icon background -->
  <rect width="512" height="512" rx="112" fill="#1C1C1E"/>

  <!-- R·W in the app serif face: letters = app gold, dot = app ink.
       The interpunct is the app's signature breakdown separator. -->
  <text x="256" y="344" text-anchor="middle"
        font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif"
        font-weight="600" font-size="220" letter-spacing="6">
    <tspan fill="#d2b15c">R</tspan><tspan fill="#ece0cc">·</tspan><tspan fill="#d2b15c">W</tspan>
  </text>
</svg>
