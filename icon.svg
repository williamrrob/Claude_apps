<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a231b"/>
      <stop offset="1" stop-color="#17120d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- the word, split into prefix / root / suffix (vintage palette) -->
  <g>
    <rect x="96"  y="128" width="86"  height="62" rx="22" fill="#cf8b6b"/>
    <rect x="198" y="128" width="116" height="62" rx="22" fill="#7fae7a"/>
    <rect x="330" y="128" width="86"  height="62" rx="22" fill="#d2b15c"/>
  </g>

  <!-- they converge downward and fuse into one meaning -->
  <g fill="none" stroke-width="14" stroke-linecap="round" opacity="0.92">
    <path d="M139 198 C139 268 256 250 256 322" stroke="#cf8b6b"/>
    <path d="M256 198 V322" stroke="#7fae7a"/>
    <path d="M373 198 C373 268 256 250 256 322" stroke="#d2b15c"/>
  </g>

  <circle cx="256" cy="368" r="44" fill="#ece0cc"/>
  <circle cx="256" cy="368" r="44" fill="none" stroke="#2a231b" stroke-opacity="0.25" stroke-width="3"/>
</svg>
