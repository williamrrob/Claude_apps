<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 215" font-family="Georgia, 'Times New Roman', serif">
  <rect width="360" height="215" fill="#1b1712"/>
  <rect x="16" y="16" width="328" height="183" rx="16" fill="#262017" stroke="rgba(245,235,215,0.14)"/>
  <text x="32" y="42" font-size="11" letter-spacing="1.4" fill="#a99a83">USAGE OVER TIME</text>
  <text x="328" y="42" text-anchor="end" font-size="12" font-style="italic" fill="#a99a83">philosophy</text>

  <!-- baseline -->
  <line x1="34" y1="152" x2="334" y2="152" stroke="rgba(245,235,215,0.14)"/>

  <!-- 11 half-century bars: 1500 … 2000 -->
  <g fill="#d2b15c" fill-opacity="0.85">
    <rect x="40"  y="140" width="20" height="12" rx="2.5"/>
    <rect x="66"  y="134" width="20" height="18" rx="2.5"/>
    <rect x="92"  y="124" width="20" height="28" rx="2.5"/>
    <rect x="118" y="114" width="20" height="38" rx="2.5"/>
    <rect x="144" y="102" width="20" height="50" rx="2.5"/>
    <rect x="170" y="82"  width="20" height="70" rx="2.5"/>
    <rect x="196" y="60"  width="20" height="92" rx="2.5"/>
    <rect x="222" y="64"  width="20" height="88" rx="2.5"/>
    <rect x="248" y="78"  width="20" height="74" rx="2.5"/>
    <rect x="274" y="88"  width="20" height="64" rx="2.5"/>
    <rect x="300" y="96"  width="20" height="56" rx="2.5"/>
  </g>

  <!-- first-recorded marker on the earliest bar -->
  <circle cx="50" cy="140" r="3.6" fill="#d2685f" stroke="#262017" stroke-width="2"/>
  <text x="50" y="132" text-anchor="middle" font-size="9.5" font-style="italic" fill="#ece0cc">first use</text>

  <!-- century labels (every other bar) -->
  <g font-size="10.5" fill="#a99a83" text-anchor="middle">
    <text x="50"  y="167">1500</text>
    <text x="102" y="167">1600</text>
    <text x="154" y="167">1700</text>
    <text x="206" y="167">1800</text>
    <text x="258" y="167">1900</text>
    <text x="310" y="167">2000</text>
  </g>

  <text x="32" y="191" font-size="11.5" font-style="italic" fill="#6f6452">Bars at half-century resolution (1500–2020).</text>
</svg>
