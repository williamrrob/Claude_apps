<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <script>
    /* iOS Safari's 100dvh can freeze at whatever chrome (address-bar) state
       was live at the moment of load/reload, instead of tracking it — most
       visible right after a hard reload, which shows full chrome and can
       leave dvh stuck short even once the chrome later collapses. Drive the
       app's height from visualViewport instead, which stays live, and fall
       back to 100dvh (see .app in styles.css) if visualViewport is absent. */
    (function () {
      var vv = window.visualViewport;
      var root = document.documentElement;
      /* Only OVERRIDE the app height while the software keyboard is open. At rest
         we clear the override so CSS `height: 100dvh` owns it — that's the
         browser-maintained full-viewport height, immune to the two failure modes
         of a JS-driven height: (1) iOS often doesn't fire a visualViewport resize
         when the keyboard CLOSES, so a persistent override gets stuck at the
         shrunken height and the whole app (with its bottom dock) rides up, and
         (2) a stale value latched during a transition never self-corrects.
         Keyboard-open is detected as a big gap between the layout viewport
         (window.innerHeight) and the visual viewport (vv.height). */
      function update() {
        var kbOpen = vv && (window.innerHeight - vv.height) > 120;
        if (kbOpen) {
          root.style.setProperty("--app-height", vv.height + "px");
          /* iOS can also scroll the VISUAL viewport down inside the (unchanged)
             layout viewport on focus, leaving offsetTop > 0; matching it as
             --app-top (see .app { top }) keeps the app pinned to what's visible
             instead of floating up behind the status bar. */
          root.style.setProperty("--app-top", vv.offsetTop + "px");
        } else {
          /* At rest use the layout-viewport height (window.innerHeight): unlike
             visualViewport.height it never shrinks for the keyboard, so it can't
             get stuck small when iOS skips the keyboard-close resize; unlike
             100dvh it can't freeze at a stale chrome state. This is the height
             the app should fill whenever the keyboard is down. */
          root.style.setProperty("--app-height", window.innerHeight + "px");
          root.style.setProperty("--app-top", "0px");
        }
      }
      update();
      window.addEventListener("resize", update);
      window.addEventListener("orientationchange", update);
      window.addEventListener("pageshow", update);
      if (vv) { vv.addEventListener("resize", update); vv.addEventListener("scroll", update); }
      /* the keyboard closing doesn't reliably fire a visualViewport resize on
         iOS — reset explicitly when focus enters/leaves the search field. */
      document.addEventListener("focusin", function () { setTimeout(update, 60); });
      document.addEventListener("focusout", function () { setTimeout(update, 60); });
    })();
  </script>
  <meta name="theme-color" content="#1b1712" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f1e7cf" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rootwork" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Rootwork — visual etymology</title>
  <link rel="stylesheet" href="styles.css?v=136" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button id="savedWordsBtn" class="icon-toggle" type="button" aria-label="Saved words">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M6.5 3.5a1.5 1.5 0 0 0-1.5 1.5v15.2l7-4.5 7 4.5V5a1.5 1.5 0 0 0-1.5-1.5z"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <span id="quizCount" class="quiz-count" hidden></span>
      </button>
      <button id="refreshBtn" class="icon-toggle" type="button" aria-label="Check for updates">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path d="M20 11.5A8 8 0 1 0 18.4 16.6M20 4.5V10h-5.5"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle light / dark">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor"/>
        </svg>
      </button>
      <button id="settingsBtn" class="icon-toggle" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <dialog id="settingsDialog" class="settings-dialog">
      <form method="dialog" class="settings-form">
        <h2>Merriam-Webster API keys</h2>
        <p class="settings-note">Stored only in this browser (localStorage) — never uploaded. Register free keys for the
          <em>Collegiate Dictionary</em> and <em>Collegiate Thesaurus</em> at dictionaryapi.com. With keys set, searching
          a word pulls MW definitions, etymology and thesaurus data automatically.</p>
        <label>Dictionary key
          <input id="mwDictKey" type="text" autocomplete="off" spellcheck="false" placeholder="xxxxxxxx-xxxx-…" />
        </label>
        <label>Thesaurus key
          <input id="mwThesKey" type="text" autocomplete="off" spellcheck="false" placeholder="xxxxxxxx-xxxx-…" />
        </label>
        <div class="settings-actions">
          <button value="cancel" type="submit" class="settings-cancel">Cancel</button>
          <button id="mwKeysSave" value="save" type="submit" class="settings-save">Save</button>
        </div>
      </form>
    </dialog>

    <div class="minihead" id="miniHead"></div>
    <button id="quizPeekBack" class="quiz-peek-back" type="button">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to quiz
    </button>

    <main class="content" id="content">
      <div class="hint" id="hint">
        <button id="homeQuizBtn" class="hint-quiz-btn" type="button">✦ Start a quiz</button>
        <div class="chips">
          <button class="example" data-word="biography">biography</button>
          <button class="example" data-word="incredible">incredible</button>
          <button class="example" data-word="democracy">democracy</button>
          <button class="example" data-word="prescription">prescription</button>
          <button class="example" data-word="philosophy">philosophy</button>
          <button class="example" data-word="microscope">microscope</button>
        </div>
        <div class="alpha" id="alpha" aria-label="Browse by letter"></div>
      </div>

      <section class="entry" id="entry" aria-live="polite"></section>
      <div class="note" id="note" hidden></div>
      <div class="ipa-key" id="ipaKey" hidden></div>
      <div class="cards" id="cards"></div>
    </main>

    <section class="browse" id="browse" hidden aria-label="Browse words"></section>
    <section class="tree" id="tree" hidden aria-label="Word family tree"></section>
    <section class="quiz" id="quiz" hidden aria-label="Vocabulary quiz"></section>

    <div class="dock-fade" aria-hidden="true"></div>
    <footer class="dock">
      <div class="recent" id="recent" hidden aria-label="Recent searches"></div>
      <ul class="suggest" id="suggest" hidden aria-label="Suggestions"></ul>
      <div class="dock-row">
        <div class="nav-pair">
          <button id="navHome" class="nav-btn" type="button" aria-label="Home">
            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
              <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/>
            </svg>
          </button>
          <button id="navBack" class="nav-btn" type="button" aria-label="Back" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button id="navFwd" class="nav-btn" type="button" aria-label="Forward" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <form id="searchForm" class="search" autocomplete="off">
          <input
            id="wordInput"
            class="search-input"
            type="text"
            enterkeyhint="search"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            placeholder="Type a word…"
            aria-label="Word to analyze"
          />
          <button type="submit" class="search-btn" aria-label="Analyze">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor"
                    stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </div>
    </footer>
  </div>

  <script>
    /* register the service worker so the installed home-screen app self-updates */
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
    /* manual refresh: clear caches + SW and hard-reload to pull the latest */
    window.addEventListener("load", function () {
      var rb = document.getElementById("refreshBtn");
      if (!rb) return;
      rb.addEventListener("click", function () {
        rb.classList.add("spinning");
        Promise.resolve()
          .then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null; })
          .then(function () { return navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : null; })
          .catch(function () {})
          .then(function () { location.reload(); });
      });
    });
  </script>
  <script defer src="data.js?v=62"></script>
  <script defer src="engine.js?v=61"></script>
  <script defer src="mw-map.js?v=1"></script>
  <script defer src="app.js?v=151"></script>
</body>
</html>
