<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <script>
    /* Keyboard handling. Rather than resize/reposition the app to the visual
       viewport (fragile on iOS: stale/absent resize events, offset-scroll, and
       body-texture bleed when the app doesn't cover the screen), the app stays
       fixed at full size and only a --kb custom property — the software
       keyboard's height — lifts the bottom dock above the keyboard. See the
       matching CSS in styles.css (.app, .dock, .dock-fade, .content). */
    (function () {
      var vv = window.visualViewport;
      var root = document.documentElement;
      /* The app stays full-screen at all times (.app is position:fixed; inset:0),
         so it always covers the paper-texture body background — nothing floats and
         no grain ever shows past the UI. The ONLY thing the keyboard changes is
         --kb, the keyboard's height (how much shorter the VISUAL viewport is than
         the layout viewport). The bottom dock (and the content's bottom padding)
         lift by --kb so the search bar rides just above the keyboard. Because the
         app itself never moves or resizes, none of the visualViewport timing/stale
         quirks can misposition it — worst case the dock lift is briefly off. */
      function update() {
        var kb = vv ? Math.max(0, window.innerHeight - vv.height) : 0;
        root.style.setProperty("--kb", kb + "px");
      }
      update();
      window.addEventListener("resize", update);
      window.addEventListener("orientationchange", update);
      window.addEventListener("pageshow", update);
      if (vv) { vv.addEventListener("resize", update); vv.addEventListener("scroll", update); }
      /* iOS doesn't always fire a viewport resize when the keyboard closes —
         recompute across the focus transition to catch it. */
      function recheck() { update(); setTimeout(update, 100); setTimeout(update, 350); setTimeout(update, 600); }
      document.addEventListener("focusin", recheck);
      document.addEventListener("focusout", recheck);
    })();
  </script>
  <meta name="theme-color" content="#1c2541" />
  <script>
    /* the chosen look is applied before first paint, so the page never flashes another one */
    (function () { var l = "planisphere"; try { l = localStorage.getItem("rootwork.look") || l; } catch (e) {}
      document.documentElement.setAttribute("data-look", l); })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rootwork" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Rootwork — visual etymology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&amp;family=Libre+Caslon+Display&amp;family=IM+Fell+English:ital@0;1&amp;family=IM+Fell+English+SC&amp;family=Overpass:ital,wght@0,400;0,600;0,700;1,600&amp;family=Overpass+Mono:wght@400;600&amp;family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&amp;family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;family=Playfair+Display+SC:wght@400;700&amp;family=Tinos:ital,wght@0,400;0,700;1,400&amp;family=Arimo:wght@400;700&amp;family=Cousine&amp;display=swap" />
  <link rel="stylesheet" href="styles.css?v=147" />
  <link rel="stylesheet" href="looks.css?v=9" />
</head>
<body>
  <div class="map" id="map" aria-label="Map of English etymology"></div>
  <div class="edge edge-top" aria-hidden="true"></div><div class="edge edge-bot" aria-hidden="true"></div>
  <div class="app">
    <div class="ns-title" id="nsTitle" aria-hidden="true">Netscape - [Rootwork]</div>
    <header class="topbar">
      <div class="lens" role="tablist" aria-label="View">
        <button class="lens-btn on" data-lens="descent" role="tab" aria-selected="true">Descent</button>
        <button class="lens-btn" data-lens="sense" role="tab" aria-selected="false">Sense</button>
        <button class="lens-btn" data-lens="doublets" role="tab" aria-selected="false">Doublets</button>
      </div>
      <span class="topbar-gap"></span>
      <button id="savedWordsBtn" class="icon-toggle" type="button" aria-label="Saved words" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M6.5 3.5a1.5 1.5 0 0 0-1.5 1.5v15.2l7-4.5 7 4.5V5a1.5 1.5 0 0 0-1.5-1.5z"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <span id="quizCount" class="quiz-count" hidden></span>
      </button>
      <button id="refreshBtn" class="icon-toggle" type="button" aria-label="Check for updates" hidden>
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path d="M20 11.5A8 8 0 1 0 18.4 16.6M20 4.5V10h-5.5"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle light / dark" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor"/>
        </svg>
      </button>
      <button class="icon-toggle map-key-btn" id="mapKeyBtn" type="button" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="map-key" id="mapKey" hidden></div>
    </header>

    <div class="minihead" id="miniHead"></div>
    <button id="quizPeekBack" class="quiz-peek-back" type="button">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to quiz
    </button>

    <div class="wander-note" id="wanderNote" role="status" hidden></div>
    <div class="trace-cap" id="traceCap" role="status" aria-live="polite"></div>
    <svg class="leader" id="leader" aria-hidden="true"><line id="leaderLine" x1="0" y1="0" x2="0" y2="0"/><circle id="leaderDot" r="3"/></svg>
    <div class="callout" id="callout" hidden></div>
    <main class="content" id="content">
      <div class="hint" id="hint">
        <button id="randomBtn" class="home-act" type="button">⤨ Somewhere else</button>
        <button id="huntBtn" class="home-act" type="button">⑂ Doublet hunt</button>
        <button id="homeQuizBtn" class="home-act" type="button">✦ Quiz</button>
        <div class="alpha" id="alpha" hidden aria-hidden="true"></div>
      </div>

      <button class="sheet-grip" id="sheetGrip" type="button" aria-label="Expand or collapse"><span></span></button>
      <section class="entry" id="entry" aria-live="polite"></section>
      <div class="note" id="note" hidden></div>
      <div class="ipa-key" id="ipaKey" hidden></div>
      <div class="cards" id="cards"></div>
    </main>

    <section class="browse" id="browse" hidden aria-label="Browse words"></section>
    <section class="tree" id="tree" hidden aria-label="Word family tree"></section>
    <section class="quiz" id="quiz" hidden aria-label="Vocabulary quiz"></section>

    <div class="dock-fade" aria-hidden="true"></div>
    <div class="acts" id="acts" hidden role="menu" aria-label="Actions"></div>
    <button class="orb" id="orb" type="button" aria-label="Actions" aria-haspopup="menu"></button>
    <div class="ns-status" id="nsStatus" aria-hidden="true"><span class="ns-well ns-key"><svg viewBox="0 0 14 12" width="14" height="12"><circle cx="4" cy="6" r="3" fill="none" stroke="#808080" stroke-width="1.5"/><path d="M7 6 H11 M10 6 V9 M8.5 3 L9.5 9" stroke="#808080" stroke-width="1.5"/></svg></span><span class="ns-well ns-msg" id="nsMsg">Document: Done</span><span class="ns-well ns-prog"></span></div>
    <footer class="dock">
      <div class="recent" id="recent" hidden aria-label="Recent searches"></div>
      <ul class="suggest" id="suggest" hidden aria-label="Suggestions"></ul>
      <div class="dock-row">
        <div class="nav-pair">
          <button id="navHome" class="nav-btn" type="button" aria-label="Step out">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="2.4" fill="currentColor"/>
              <circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".75"/>
              <circle cx="12" cy="12" r="9.6" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".45"/>
            </svg>
          </button>
          <button id="navBack" class="nav-btn" type="button" aria-label="Back" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button id="navFwd" class="nav-btn" type="button" aria-label="Forward" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <form id="searchForm" class="search" autocomplete="off">
          <div class="qshow" id="qShow" aria-hidden="true"></div>
          <div class="qcap" id="qCap" aria-live="polite"></div>
          <input
            id="wordInput"
            class="search-input"
            type="text"
            enterkeyhint="search"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            placeholder="Type a word…"
            aria-label="Word to analyze"
          />
          <button type="submit" class="search-btn" aria-label="Search">
            <svg class="sb-find" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            <svg class="sb-go" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor"
                    stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </div>
    </footer>
  </div>

  <script>
    /* register the service worker so the installed home-screen app self-updates */
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
    /* manual refresh: clear caches + SW and hard-reload to pull the latest */
    window.addEventListener("load", function () {
      var rb = document.getElementById("refreshBtn");
      if (!rb) return;
      rb.addEventListener("click", function () {
        rb.classList.add("spinning");
        Promise.resolve()
          .then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null; })
          .then(function () { return navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : null; })
          .catch(function () {})
          .then(function () { location.reload(); });
      });
    });
  </script>
  <script defer src="data.js?v=62"></script>
  <script defer src="engine.js?v=61"></script>
  <script defer src="etym-parse.js?v=4"></script>
  <script defer src="graph.js?v=13"></script>
  <script defer src="app.js?v=169"></script>
</body>
</html>
