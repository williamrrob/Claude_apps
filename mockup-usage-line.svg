<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 215" font-family="Georgia, 'Times New Roman', serif">
  <rect width="360" height="215" fill="#1b1712"/>
  <rect x="16" y="16" width="328" height="183" rx="16" fill="#262017" stroke="rgba(245,235,215,0.14)"/>
  <text x="32" y="42" font-size="11" letter-spacing="1.4" fill="#a99a83">USAGE OVER TIME</text>
  <text x="328" y="42" text-anchor="end" font-size="12" font-style="italic" fill="#a99a83">philosophy</text>

  <!-- baseline -->
  <line x1="40" y1="160" x2="330" y2="160" stroke="rgba(245,235,215,0.14)"/>

  <!-- area + line: a rise into the 19th c., dip, slight modern rise -->
  <path d="M40,150 L67,145 L96,134 L123,122 L151,112 L179,95 L207,76 L235,66 L262,88 L290,104 L318,86 L329,93 L329,160 L40,160 Z"
        fill="#d2b15c" fill-opacity="0.13"/>
  <path d="M40,150 L67,145 L96,134 L123,122 L151,112 L179,95 L207,76 L235,66 L262,88 L290,104 L318,86 L329,93"
        fill="none" stroke="#d2b15c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- peak marker -->
  <circle cx="235" cy="66" r="4.5" fill="#d2685f" stroke="#262017" stroke-width="2"/>
  <text x="235" y="56" text-anchor="middle" font-size="11" font-style="italic" fill="#ece0cc">peak c. 1850</text>

  <!-- x labels -->
  <g font-size="10.5" fill="#a99a83" text-anchor="middle">
    <text x="40" y="176">1500</text>
    <text x="151" y="176">1700</text>
    <text x="262" y="176">1900</text>
    <text x="329" y="176">2020</text>
  </g>

  <text x="32" y="194" font-size="11.5" font-style="italic" fill="#6f6452">Smooth frequency curve (Google Books–style).</text>
</svg>
