<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <clipPath id="card"><rect x="20" y="40" width="340" height="224" rx="22"/></clipPath>
    <filter id="frost" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.9" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="380" height="300" fill="#1b1712"/>
  <!-- colored blobs the glass sits over, so the frost/refraction is visible -->
  <g id="blobs">
    <circle cx="90"  cy="120" r="70" fill="#b02b25" opacity="0.55"/>
    <circle cx="300" cy="90"  r="80" fill="#d2b15c" opacity="0.40"/>
    <circle cx="250" cy="240" r="90" fill="#7fae7a" opacity="0.30"/>
    <circle cx="120" cy="250" r="60" fill="#d2685f" opacity="0.30"/>
  </g>

  <!-- frosted backdrop: a blurred copy of the blobs, clipped to the card -->
  <g clip-path="url(#card)">
    <use href="#blobs" filter="url(#frost)"/>
    <rect x="20" y="40" width="340" height="224" fill="#1b1712" opacity="0.55"/>
    <rect x="20" y="40" width="340" height="224" fill="url(#sheen)"/>
  </g>
  <!-- glass rim: bright top edge fading down + hairline border -->
  <rect x="20.5" y="40.5" width="339" height="223" rx="21.5" fill="none" stroke="url(#edge)" stroke-width="1.2"/>

  <!-- card content -->
  <text x="40" y="68" font-size="11" letter-spacing="1.4" fill="#c9bfa8">BREAKDOWN</text>
  <rect x="38" y="84" width="3" height="40" rx="1.5" fill="#7fae7a"/>
  <text x="54" y="106" font-size="22" font-weight="700" fill="#9ed19a">scribere</text>
  <text x="342" y="106" text-anchor="end" font-size="15" fill="#f1e7d2">to write</text>
  <text x="54" y="124" font-size="10.5" letter-spacing="0.8" fill="#cdbfa6">LATIN · ROOT</text>
  <text x="342" y="124" text-anchor="end" font-size="12.5" font-style="italic" fill="#cdbfa6">shows up as: script, scrib</text>

  <rect x="38" y="150" width="3" height="40" rx="1.5" fill="#d2b15c"/>
  <text x="54" y="172" font-size="22" font-weight="700" fill="#e3c46e">-alis</text>
  <text x="342" y="172" text-anchor="end" font-size="15" fill="#f1e7d2">relating to</text>
  <text x="54" y="190" font-size="10.5" letter-spacing="0.8" fill="#cdbfa6">LATIN · SUFFIX</text>
  <text x="342" y="190" text-anchor="end" font-size="12.5" font-style="italic" fill="#cdbfa6">shows up as: al</text>

  <text x="40" y="240" font-size="11.5" font-style="italic" fill="#cdbfa6">Frostier translucent panels: brighter top rim, soft inner sheen,</text>
  <text x="40" y="256" font-size="11.5" font-style="italic" fill="#cdbfa6">stronger backdrop blur — color from behind glows through.</text>
</svg>
