<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 215" font-family="Georgia, 'Times New Roman', serif">
  <rect width="360" height="215" fill="#1b1712"/>
  <rect x="16" y="16" width="328" height="183" rx="16" fill="#262017" stroke="rgba(245,235,215,0.14)"/>
  <text x="32" y="42" font-size="11" letter-spacing="1.4" fill="#a99a83">USAGE BY CENTURY</text>
  <text x="328" y="42" text-anchor="end" font-size="12" font-style="italic" fill="#a99a83">philosophy</text>

  <!-- baseline -->
  <line x1="34" y1="152" x2="332" y2="152" stroke="rgba(245,235,215,0.14)"/>

  <!-- bars: 1500s … 2000s -->
  <g fill="#d2b15c" fill-opacity="0.85">
    <rect x="40"  y="134" width="36" height="18" rx="3"/>
    <rect x="88"  y="118" width="36" height="34" rx="3"/>
    <rect x="136" y="97"  width="36" height="55" rx="3"/>
    <rect x="184" y="60"  width="36" height="92" rx="3"/>
    <rect x="232" y="74"  width="36" height="78" rx="3"/>
    <rect x="280" y="92"  width="36" height="60" rx="3"/>
  </g>

  <!-- first-recorded marker on the earliest bar -->
  <circle cx="58" cy="134" r="4" fill="#d2685f" stroke="#262017" stroke-width="2"/>
  <text x="58" y="126" text-anchor="middle" font-size="10" font-style="italic" fill="#ece0cc">first use</text>

  <!-- century labels -->
  <g font-size="10.5" fill="#a99a83" text-anchor="middle">
    <text x="58"  y="166">1500s</text>
    <text x="106" y="166">1600s</text>
    <text x="154" y="166">1700s</text>
    <text x="202" y="166">1800s</text>
    <text x="250" y="166">1900s</text>
    <text x="298" y="166">2000s</text>
  </g>

  <text x="32" y="190" font-size="11.5" font-style="italic" fill="#6f6452">Bars per century — simpler, fits the vintage look.</text>
</svg>
